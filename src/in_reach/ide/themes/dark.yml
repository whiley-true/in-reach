# in-reach IDE theme -- see in_reach/ide/theme.py's module docstring for the schema.
#
# `window` is the fixed chrome shade (top bar/activity bar); `base` is the lighter panel-body
# shade every "card" (sidebar, tab panel, bottom panel) paints itself with, so panels stand out
# from the surrounding chrome.

name: Dark

palette:
  window: "#1e1e1e"
  window_text: "#f0f0f0"
  base: "#252526"
  alternate_base: "#2d2d2d"
  tooltip_base: "#f0f0f0"
  tooltip_text: "#f0f0f0"
  text: "#f0f0f0"
  button: "#2b2b2b"
  button_text: "#f0f0f0"
  bright_text: "#ff5050"
  link: "#2a82da"
  highlight: "#2a82da"
  highlighted_text: "#000000"
  mid: "#3f3f3f"
disabled_text: "#7f7f7f"
