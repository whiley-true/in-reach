# in-reach IDE theme -- see in_reach/ide/theme.py's module docstring for the schema.
#
# `palette` keys map onto QPalette color roles (theme.py's _PALETTE_ROLES); anything not listed
# keeps Qt's own Fusion-style default for that role.

name: Light

palette:
  window: "#f0f0f0"
  window_text: "#000000"
  base: "#ffffff"
  alternate_base: "#f7f7f7"
  tooltip_base: "#ffffdc"
  tooltip_text: "#000000"
  text: "#000000"
  button: "#f0f0f0"
  button_text: "#000000"
  bright_text: "#ff0000"
  link: "#0000ff"
  highlight: "#308cc6"
  highlighted_text: "#ffffff"
  mid: "#d4d4d4"
disabled_text: "#787878"
