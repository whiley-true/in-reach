[project]
name = "sample"

[constants]
# Placeholders like ${SCORE_TO_WIN} are replaced everywhere in the script. An env
# (script/env/<name>.env) can override any of these -- put SCORE_TO_WIN=50 in release.env
# and a release build wins at 50 while a dev build wins at 10.
SCORE_TO_WIN = 10

[blocks]
# The order the blocks are built in. TICK has no file of its own: the modules below add to it.
order = ["SETUP", "TICK", "WIN_CHECK"]

[[modules]]
name = "scoring"
enabled = false

[[modules]]
name = "speed_boost"
enabled = false
