name: Branch Guard

on:
  pull_request:
    branches: [release]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require PRs into release to come from development
        run: |
          head_ref="${{ github.head_ref }}"
          if [[ "$head_ref" != "development" ]]; then
            echo "PRs into release must come from the 'development' branch (got '$head_ref')."
            exit 1
          fi
