name: Branch Guard

on:
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require PRs into main to come from a release branch
        run: |
          head_ref="${{ github.head_ref }}"
          if [[ "$head_ref" != "release" && "$head_ref" != release/* ]]; then
            echo "PRs into main must come from the 'release' branch or a 'release/*' branch (got '$head_ref')."
            exit 1
          fi
