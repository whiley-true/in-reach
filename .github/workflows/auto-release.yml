name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Determine version from release branch name
        id: version
        run: |
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          VERSION="${HEAD_REF#release/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --target main

      - name: Delete release branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          git push origin --delete "${{ github.event.pull_request.head.ref }}" || true

      - name: Open PR to sync main into development
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh pr create \
            --base development \
            --head main \
            --title "Sync main v$VERSION into development" \
            --body "Automated sync after releasing v$VERSION." \
            || echo "Nothing to sync, or a sync PR already exists."
