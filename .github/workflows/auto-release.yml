name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [release]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Determine bump type from PR labels
        id: bump
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          TYPE=""
          for l in major minor patch; do
            if echo "$LABELS" | grep -q "\"bump:$l\""; then
              if [ -n "$TYPE" ]; then
                echo "Multiple bump:* labels found; expected exactly one." >&2
                exit 1
              fi
              TYPE="$l"
            fi
          done
          if [ -z "$TYPE" ]; then
            echo "No bump:major|minor|patch label found on the PR." >&2
            exit 1
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        run: |
          BASE_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$BASE_TAG" ]; then
            BASE=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          else
            BASE="${BASE_TAG#v}"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          case "${{ steps.bump.outputs.type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEXT="$MAJOR.$MINOR.$PATCH"
          echo "Base: $BASE -> Next: $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Commit version bump to release
        id: bump_commit
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python -m pip install --upgrade tomlkit
          python - "$VERSION" <<'PYEOF'
          import pathlib
          import re
          import sys

          import tomlkit

          version = sys.argv[1]

          pyproject_path = pathlib.Path("pyproject.toml")
          doc = tomlkit.parse(pyproject_path.read_text(encoding="utf-8"))
          doc["project"]["version"] = version
          pyproject_path.write_text(tomlkit.dumps(doc), encoding="utf-8")

          init_path = pathlib.Path("src/inreach/__init__.py")
          text = init_path.read_text(encoding="utf-8")
          text, count = re.subn(r'__version__ = ".*"', f'__version__ = "{version}"', text)
          if count == 0:
              raise ValueError(f"__version__ assignment not found in {init_path}")
          init_path.write_text(text, encoding="utf-8")

          readme_path = pathlib.Path("README.md")
          lines = readme_path.read_text(encoding="utf-8").splitlines(keepends=True)
          ending = "\n"
          if lines:
              ending = lines[0][len(lines[0].rstrip("\r\n")):] or "\n"
              lines[0] = f"# inreach - v{version}{ending}"
          else:
              lines = [f"# inreach - v{version}{ending}"]
          readme_path.write_text("".join(lines), encoding="utf-8")
          PYEOF
          git add pyproject.toml src/inreach/__init__.py README.md
          git commit -m "chore: bump version to $VERSION"
          git push origin HEAD:release
          echo "bump_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sync version bump to development
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git fetch origin development
          git checkout -B development origin/development
          git merge --no-ff "${{ steps.bump_commit.outputs.bump_sha }}" -m "Merge release v$VERSION into development"
          git push origin HEAD:development

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
