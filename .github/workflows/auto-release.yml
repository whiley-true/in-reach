name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Determine version from release branch name
        id: version
        run: |
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          VERSION="${HEAD_REF#release/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Bump version on main
        id: bump_commit
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python -m pip install --upgrade tomlkit
          python - "$VERSION" <<'PYEOF'
          import pathlib
          import re
          import sys

          import tomlkit

          version = sys.argv[1]

          pyproject_path = pathlib.Path("pyproject.toml")
          doc = tomlkit.parse(pyproject_path.read_text(encoding="utf-8"))
          doc["project"]["version"] = version
          pyproject_path.write_text(tomlkit.dumps(doc), encoding="utf-8")

          init_path = pathlib.Path("src/in_reach/__init__.py")
          text = init_path.read_text(encoding="utf-8")
          text, count = re.subn(r'__version__ = ".*"', f'__version__ = "{version}"', text)
          if count == 0:
              raise ValueError(f"__version__ assignment not found in {init_path}")
          init_path.write_text(text, encoding="utf-8")
          PYEOF
          git add pyproject.toml src/inreach/__init__.py
          git commit -m "chore: bump version to $VERSION"
          git push origin HEAD:main
          echo "bump_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sync version bump to development
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git fetch origin development
          git checkout -B development origin/development
          git merge --no-ff "${{ steps.bump_commit.outputs.bump_sha }}" -m "Merge main v$VERSION into development"
          git push origin HEAD:development

      - name: Delete release branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          git push origin --delete "${{ github.event.pull_request.head.ref }}" || true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --target main
