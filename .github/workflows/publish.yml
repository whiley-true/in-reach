name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Bump version from release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install --upgrade tomlkit
          VERSION="${TAG_NAME#v}"
          python - "$VERSION" <<'PYEOF'
          import pathlib
          import re
          import sys

          import tomlkit

          version = sys.argv[1]

          pyproject_path = pathlib.Path("pyproject.toml")
          doc = tomlkit.parse(pyproject_path.read_text(encoding="utf-8"))
          doc["project"]["version"] = version
          pyproject_path.write_text(tomlkit.dumps(doc), encoding="utf-8")

          init_path = pathlib.Path("src/inreach/__init__.py")
          text = init_path.read_text(encoding="utf-8")
          text, count = re.subn(r'__version__ = ".*"', f'__version__ = "{version}"', text)
          if count == 0:
              raise ValueError(f"__version__ assignment not found in {init_path}")
          init_path.write_text(text, encoding="utf-8")

          readme_path = pathlib.Path("README.md")
          lines = readme_path.read_text(encoding="utf-8").splitlines(keepends=True)
          ending = "\n"
          if lines:
              ending = lines[0][len(lines[0].rstrip("\r\n")):] or "\n"
              lines[0] = f"# inreach - v{version}{ending}"
          else:
              lines = [f"# inreach - v{version}{ending}"]
          readme_path.write_text("".join(lines), encoding="utf-8")

          print(f"Updated version to {version}")
          PYEOF
      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
