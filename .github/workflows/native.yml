name: Native extension

# Builds `_reachvarianttool` (the ReachVariantTool engine, vendored under native/) from source on Windows,
# runs the whole test suite against the module it just built -- the Ubuntu jobs in tests.yml skip every test
# that needs it -- and produces platform-tagged wheels that contain it.
#
# This workflow only *builds and uploads artifacts*. Publishing to PyPI is still publish.yml, which builds an
# untagged wheel from the committed module; switch it to these wheels once this job has passed on a real run.

on:
  pull_request:
    branches: [development, main]
    paths:
      - "native/**"
      - "src/in_reach/app/rvt/**"
      - "tests/app/rvt/**"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/native.yml"
  workflow_dispatch:

jobs:
  build:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-2022
    # Qt5 is compiled from source by vcpkg the first time (well over half an hour); the binary cache below
    # makes every later run skip that.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          # Only the vcpkg checkout on the runner image and the port being built decide what's in it.
          key: vcpkg-qt5-base-x64-windows-${{ runner.os }}-v1

      - name: Install Qt5 (vcpkg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install qt5-base:x64-windows

      - name: Install build and test dependencies
        run: python -m pip install pybind11 build ".[dev]"

      - name: Build _reachvarianttool
        run: python native/build.py --vcpkg-root "$env:VCPKG_INSTALLATION_ROOT"

      - name: Run the whole test suite against it
        run: python -m pytest -q

      - name: Build the wheel
        run: python -m build --wheel --outdir dist

      - name: Check the wheel is tagged for this Python and platform
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          Write-Host $wheel.Name
          $tag = "cp$('${{ matrix.python-version }}'.Replace('.', ''))-cp$('${{ matrix.python-version }}'.Replace('.', ''))-win_amd64"
          if ($wheel.Name -notlike "*-$tag.whl") { throw "expected a $tag wheel, got $($wheel.Name)" }

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python-version }}
          path: dist/*.whl
