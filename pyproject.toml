[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inreach"
version = "0.1.0"
description = "Python tooling and mine IDE to help improve the Halo Reach scripting experience."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Whiley True", email = "inreach.python@gmail.com" }]
dependencies = [
    "click==8.5.0",
    "python-dotenv==1.2.3",
    "tomlkit==0.15.1",
]