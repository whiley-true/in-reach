[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inreach"
version = "0.1.4"
description = "Python tooling to help improve the Halo Reach scripting experience."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Whiley True", email = "inreach.python@gmail.com" }]
dependencies = [
    "annotated-types==0.8.0",
    "click==8.4.2",
    "colorama==0.4.6",
    "iniconfig==2.3.0",
    "MouseInfo==0.1.3",
    "numpy==2.5.2",
    "opencv-python==4.14.0.94",
    "packaging==26.3",
    "pillow==12.3.0",
    "pluggy==1.6.0",
    "PyAutoGUI==0.9.54",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "pydirectinput==1.0.4; sys_platform == 'win32'",
    "PyGetWindow==0.0.9",
    "Pygments==2.21.0",
    "PyMsgBox==2.0.1",
    "pyperclip==1.11.0",
    "PyRect==0.2.0",
    "PyScreeze==1.0.1",
    "pytesseract==0.3.13",
    "pytest==9.1.1",
    "python-dotenv==1.2.3",
    "pytweening==1.2.0",
    "pywin32==312; sys_platform == 'win32'",
    "tomlkit==0.15.1",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
]

[project.scripts]
inreach = "inreach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inreach = [
    "scripts/*.bat",
    "app/anchors/save-game-type/*.png",
    ".inreach/example.env",
    ".inreach/.gitignore",
    ".inreach/logs/.gitkeep",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
