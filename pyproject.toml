[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "in-reach"
version = "0.3.0"
description = "Python tooling and command line to help improve the Halo Reach scripting experience (the IDE is in-reach-ide)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Whiley True", email = "inreach.python@gmail.com" }]
dependencies = [
    "click==8.5.0",
    "python-dotenv==1.2.3",
    "tomlkit==0.15.1",
    "pydantic==2.13.4",
    "dulwich==1.2.12",
    "merge3==0.0.16",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "setuptools>=68"]

[project.scripts]
in-reach = "in_reach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
in_reach = [
    ".in-reach/example.env",
    "app/rvt_tool/bin/**/*",
    "app/rvt/native/**/*",
    "app/blank_variants/*.bin",
]