[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inreach"
version = "0.1.4"
description = "Python tooling to help improve the Halo Reach scripting experience."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Whiley True", email = "inreach.python@gmail.com" }]
dependencies = []

[project.scripts]
inreach = "inreach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
